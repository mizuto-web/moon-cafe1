<!DOCTYPE html>
<html>
<head>    
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>予約完了</title>
  <link rel="stylesheet" href="style.css">
  <style>
   .thanks-box {
  width: 92%;
  max-width: 700px;
  margin: 0 auto;
} 
  body {
    background: linear-gradient(135deg, #f5e6dc, #d6b8a8);
    text-align: center;
    margin-top: 
    px;
    font-family: sans-serif;
  }

  h1 {
    color: #6b4f3b;
    font-size: 48px;
    font-weight: 600;
}
  p {
    color: #7a5a44;
    font-size: 24px;
  }

  button {
    cursor: pointer;
    padding: 16px 36px;
    background: #6b4f3b;
    color: white;
    font-weight: 600;
    border: none;
    border-radius: 50px;
    font-size: 20px;
    margin-top: 20px;
    transition: 0.3s;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}
button:hover {
  transform: scale(1.05) translateY(-2px);
  opacity: 0.95;
  box-shadow: 0 6px 14px rgba(0,0,0,0.25);
}

button:active {
  transform: scale(0.98);
}

/* 予約完了ページの最終調整 */

html,
body {
  margin: 0;
  min-height: 100%;
}

body {
  background: #f5e6dc !important;
  background-image: none !important;
  color: #6b4f3b;
  text-align: center;

  font-family: "Yu Mincho", "Hiragino Mincho ProN", "YuMincho", serif;

  padding: 160px 24px 80px;
  box-sizing: border-box;
}

/* 予約完了しました */
h1 {
  font-family: "Yu Mincho", "Hiragino Mincho ProN", "YuMincho", serif;
  font-size: 42px;
  font-weight: normal;
  margin: 0 0 28px;
}

/* 説明文 */
p {
  font-family: "Yu Mincho", "Hiragino Mincho ProN", "YuMincho", serif;
  font-size: 22px;
  line-height: 1.8;
  margin: 12px 0;
}

/* トップに戻る */
.btn,
button {
  font-family: "Yu Mincho", "Hiragino Mincho ProN", "YuMincho", serif;
  font-size: 19px;
  font-weight: normal;

  min-width: 190px;
  padding: 16px 32px;
  margin-top: 26px;

  background: #6b4f3b;
  color: white;
  border: none;
  border-radius: 999px;
  text-decoration: none;
  box-sizing: border-box;
}

@media (max-width: 600px) {

  body {
    background: #f5e6dc !important;
    padding: 125px 24px 0;
    box-sizing: border-box;
  }

  h1 {
    font-family: "Yu Mincho", "Hiragino Mincho ProN", "YuMincho", serif;
    font-size: 52px;
    font-weight: normal;
    margin: 0 0 34px;
  }

  p {
    font-family: "Yu Mincho", "Hiragino Mincho ProN", "YuMincho", serif;
    font-size: 24px;
    line-height: 1.8;
    margin: 0 0 14px;
  }

  .btn,
  a.btn,
  button {
    display: inline-block;
    min-width: 220px;
    padding: 18px 32px;
    margin-top: 22px;
    border-radius: 999px;
    font-family: "Yu Mincho", "Hiragino Mincho ProN", "YuMincho", serif;
    font-size: 21px;
    font-weight: normal;
    text-decoration: none;
    box-sizing: border-box;
  }
}

h1 {
  font-size: 40px !important;
  white-space: nowrap;
}

p {
  font-size: 20px !important;
  white-space: nowrap;
}

button {
  font-size: 18px !important;
  padding: 14px 32px !important;
}

</style>
</head>
<body>

<div class="form-box">
  <h1>予約完了しました</h1>
  <p>ありがとうございます！</p>
  <p>内容確認のうえご連絡いたします。</p>

  <a href="index.html">
    <button>トップに戻る</button>
  </a>
</div>

</body>
</html>
