<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<style>

body {
  background: #f5e6dc;
  text-align: center;
  margin: 0;
  min-height: 100vh;
  padding-top: 120px;
}

h1 {
  color: #6b4f3b;
  font-size: 56px;
}

p {
  color: #6b4f3b;
  font-size: 24px;
  margin-bottom: 12px;
}

input {
  display: block;
  margin: 0 auto 24px;
  width: 100%;
  height: 90px;
  padding: 0 20px;
  border-radius: 12px;
  border: none;
  margin-bottom: 24px;
  box-shadow: 0 3px 8px rgba(0,0,0,0.15);
  font-size: 26px;
  box-sizing: border-box;
}

.form-box {
  width: 100%;
  max-width: 1000px;
  margin: 0 auto;  
}

button {
  display: block;
  margin: 30px auto 0;
  cursor: pointer;
  padding: 16px 42px;
  background: #6b4f3b;
  color: white;
  border: none;
  border-radius: 50px;
  font-size: 20px;
  font-weight: 600;
  margin-top: 30px;
  transition: 0.3s;
  box-shadow: 0 4px 10px rgba(0,0,0,0.16);
}
button:hover {
  transform: scale(1.05) translateY(-2px);
  opacity: 0.95;
  box-shadow: 0 6px 14px rgba(0,0,0,0.25);
}

 .back-btn [type="submit"] {
  margin-top: 20px;
}

@media (max-width: 600px) {
  h1 {
    font-size: 40px;
  }
}
  p {
    font-size: 20px;
  

  input {
    width: 100%;
    max-width: none;
    height: 90px;
    font-size: 26px;
  }

  button {
    width: 80%;
    max-width: 260px;
    font-size: 22px;
    padding: 18px 48px;
  }
}
.btn {
  display: inline-block;
  background: #6b4f3b;
  color: white;
  padding: 12px 24px;
  border-radius: 999px;
  text-decoration: none;
  margin-top: 16px;
}
.btn, button {
  padding: 10px 20px; 
  font-size: 14px;    
  transition: 0.2s;
}

.btn:hover, button:hover {
  opacity: 0.85;
  transform: scale(1.03);
}


button,
.btn {
    display: block;
    width: 280px;
    max-width: 90%;
    height: 68px;

    margin: 20px auto 0;

    font-size: 24px;
    font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;

    border-radius: 999px;
    line-height: 68px;
    padding: 0;
    box-sizing: border-box;
}

h1 {
  font-family: "Yu Mincho", "Hiragino Mincho ProN", "YuMincho", serif;
  font-size: 52px;
  font-weight: normal;
  margin: 0 0 36px;
}

form {
  width: 90%;
  max-width: 500px;
}

form p {
  font-family: "Yu Mincho", "Hiragino Mincho ProN", "YuMincho", serif;
  font-size: 24px;
  margin: 22px 0 10px;
}

input {
  width: 100%;
  max-width: none;
  height: 64px;
  font-size: 20px;
  box-sizing: border-box;
}

/* 送信とトップに戻るをそろえる */
button[type="submit"],
.btn {
  display: block;
  width: 200px;
  max-width: 80%;
  margin: 18px auto 0;
  padding: 16px 20px;

  font-family: "Yu Mincho", "Hiragino Mincho ProN", "YuMincho", serif;
  font-size: 20px;
  font-weight: normal;
  line-height: 1.4;

  box-sizing: border-box;
}

form {
  width: 88%;
  max-width: 500px;
  margin: 0 auto;
}

form input {
  width: 100%;
  max-width: none;
  box-sizing: border-box;
}

@media (max-width: 600px) {

  body {
    padding-top: 70px;
  }

  form {
    width: 90%;
    max-width: 520px;
  }

  body h1 {
    font-size: 50px;
    font-weight: normal;
    margin-bottom: 36px;
  }

  form p {
    font-size: 24px;
    margin: 22px 0 12px;
  }

  form input {
    width: 100%;
    max-width: none;
    height: 64px;
    font-size: 20px;
    box-sizing: border-box;
  }

  button,
  .btn {
    width: 300px;
    max-width: 88%;
    height: 64px;
    font-size: 20px;
    line-height: 64px;
    padding: 0;
    margin: 18px auto 0;
  }
}

</style>
</head>
<body>
<div class="form-box">
<h1>Moon Cafe</h1>

<form action="thanks.html">

<p>お名前：</p>
<input type="text" name="name" required>

<p>人数：</p>
<input type="number" name="people" required>

<p>日時：</p>
<input type="datetime-local" name="date" required>

<button type="submit">送信</button>
<a href="index.html" class="btn">トップに戻る</a>

</form>
</div>
</body>
</html>
