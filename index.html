<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Moon Cafe</title>

<style>
 .hero-image{
  position: relative;
}

.hero-image img{
  width: 100%;
  border-radius: 30px;
  display: block;
}

.hero-title{
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

.hero-title h1{
  color: white;
  font-size: 64px;
  letter-spacing: 2px;
  text-shadow: 0 4px 15px rgba(0,0,0,0.28);
}body{
    margin:0;
    font-family: "Yu Mincho", serif;
    background:#f6ebe4;
    color:#5b4033;
}

/* ヘッダー */

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:25px 8%;
    background:#f8efea;
}

.logo{
    font-size:34px;
    font-weight:bold;
}

nav a{
    text-decoration:none;
    color:#6b4f3b;
    margin-left:28px;
    font-size:18px;
}

/* トップ */

.hero{
    display:flex;
    align-items:center;
    justify-content:space-between;
      padding: 35px 7% 30px;
    gap:50px;
}

.hero-text{
    width:45%;
}

.hero-text p{
    font-size:18px;
    line-height:2;
}

.hero-text h1{
    font-size:72px;
    margin:20px 0;
}

.hero-image{
    width:50%;
}

.hero-image img{
  width: 100%;
  height: 520px;
  object-fit: cover;
  border-radius: 24px;
  display: block;
}

/* ボタン */

.button-area{
  margin-top: 25px;
}

button{
    padding:16px 34px;
    border:none;
    border-radius:50px;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
    margin-right:15px;
}

.main-btn{
    background:#7a5a44;
    color:white;
}

.sub-btn{
    background:white;
    color:#7a5a44;
    border:1px solid #7a5a44;
}

button:hover{
    transform:translateY(-3px);
    box-shadow:0 6px 15px rgba(0,0,0,0.15);
}

/* About */

.about{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:80px 8%;
    gap:50px;
    background:white;
}

.about-text{
    width:45%;
}

.about-text h2{
    font-size:48px;
    margin-bottom:20px;
}

.about-text p{
    line-height:2;
    font-size:17px;
}

.about-image{
    width:50%;
}

.about-image img{
    width:100%;
    border-radius:25px;
}

/* メニュー */

.menu{
    padding:90px 8%;
}

.menu-title{
    text-align:center;
    font-size:52px;
    margin-bottom:50px;
}

.menu-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:30px;
}

.card{
    background:white;
    border-radius:25px;
    overflow:hidden;
    box-shadow:0 6px 18px rgba(0,0,0,0.08);
}

.card img{
    width:100%;
    height:250px;
    object-fit:cover;
}

.card-text{
    padding:20px;
}

.card-text h3{
    margin:0 0 10px;
}

.card-text p{
    color:#7a5a44;
}

/* フッター */

footer{
    text-align:center;
    padding:40px;
    background:#f3e3d9;
    margin-top:80px;
}

/* スマホ */

@media (max-width: 768px){
.menu-title{
    font-size: 42px;
}    

header{
    flex-direction:column;
    gap:20px;
}

nav a{
    margin:0 10px;
}

.hero{
    flex-direction:column;
    padding:50px 7%;
}

.hero-text{
    width:100%;
    text-align:center;
}

.hero-text h1{
    font-size:56px;
}

.hero-image{
    width:100%;
}

.about{
    flex-direction:column;
}

.about-text,
.about-image{
    width:100%;
}
.hero-image img{
    height: 340px;
}

.menu-grid{
    grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<header>

<div class="logo">☾ Moon Cafe</div>

<nav>
<a href="#">Home</a>
<a href="#">Menu</a>
<a href="#">About</a>
<a href="#">Access</a>
</nav>

</header>

<section class="hero">

  <div class="hero-image">
    <img src="cafe.webp">

    <div class="hero-title">
      <h1>Moon Cafe</h1>
    </div>
  </div>

  <div class="hero-text">
    <p>
      こだわりのコーヒーと<br>
      手作りスイーツで、<br>
      心あたたまる時間を。
    </p>

    <div class="button-area">
      <button class="main-btn">メニューを見る</button>
      <button class="sub-btn">予約する</button>
    </div>
  </div>

</section>

<section class="about">

<div class="about-text">

<h2>About</h2>

<p>
Moon Cafeは、街の小さなカフェ。<br>
ゆったりとした空間で、<br>
香り高いコーヒーとスイーツを楽しめます。
</p>

</div>

<div class="about-image">
<img src="cafe.webp">
</div>

</section>

<section class="menu">

<h2 class="menu-title">Recommended Menu</h2>

<div class="menu-grid">

<div class="card">
<img src="cafe.webp">
<div class="card-text">
<h3>カフェラテ</h3>
<p>¥480</p>
</div>
</div>

<div class="card">
<img src="cafe.webp">
<div class="card-text">
<h3>いちごケーキ</h3>
<p>¥650</p>
</div>
</div>

<div class="card">
<img src="cafe.webp">
<div class="card-text">
<h3>パンケーキ</h3>
<p>¥680</p>
</div>
</div>

</div>

</section>

<footer>

<p>© Moon Cafe</p>

</footer>

</body>
</html>
